# Gradle
org.gradle.jvmargs=-Xmx2048m
# Disable the HTML problems report: on the external APFS volume Gradle
# cannot move the temp report into build/, which fails the whole build
# at the very end even though the APK was produced fine.
org.gradle.problems.report=false

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Display version / APK filename (fallback in buildSrc is 0.0.0-dev.1)
jellyfin.version=1.0.1
